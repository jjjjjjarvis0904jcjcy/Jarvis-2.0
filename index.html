<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000b12;--ink:#d9fbff;--dim:#5f93a0;--c:#2aa9c0;--k:1;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:radial-gradient(90% 70% at 50% 45%,#02202c 0%,var(--bg) 62%,#000 100%);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative}
body[data-s=listen]{--c:#38e8ff;--k:.55}
body[data-s=think]{--c:#ffb347;--k:.2}
body[data-s=speak]{--c:#b9f7ff;--k:.45}
.grid,.scan{position:fixed;inset:0;pointer-events:none}
.grid{background:linear-gradient(rgba(56,232,255,.045) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(56,232,255,.045) 1px,transparent 1px) 0 0/44px 44px;-webkit-mask-image:radial-gradient(75% 65% at 50% 48%,#000,transparent);mask-image:radial-gradient(75% 65% at 50% 48%,#000,transparent)}
.scan{background:repeating-linear-gradient(0deg,rgba(56,232,255,.05) 0 1px,transparent 1px 3px)}
.scan::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(transparent,rgba(56,232,255,.07),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{from{top:-25%}to{top:105%}}
.br{position:fixed;width:28px;height:28px;border:2px solid var(--c);opacity:.7;transition:border-color .4s}
.tl{left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));border-right:0;border-bottom:0}
.tr{right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));border-left:0;border-bottom:0}
.bl{left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));border-right:0;border-top:0}
.bb{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));border-left:0;border-top:0}
header{position:relative;text-align:center;padding:22px 12px 0}
h1{margin:0;font:700 clamp(26px,8vw,44px)/1 Orbitron,Eurostile,"Bank Gothic","Segoe UI",system-ui,sans-serif;letter-spacing:.22em;padding-left:.22em;color:var(--ink);text-shadow:0 0 14px var(--c),0 0 36px var(--c);animation:ttl 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ttl{from{letter-spacing:.9em;opacity:0}}
#sub{margin-top:10px;font:400 12px/1 Orbitron,system-ui,sans-serif;letter-spacing:.34em;padding-left:.34em;color:var(--c);transition:color .4s}
header::after{content:"";display:block;width:min(60vw,300px);height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--c),transparent)}
main{position:relative;flex:1;min-height:0;width:100%;display:grid;place-items:center}
#hud{position:relative;width:min(92vw,50dvh,520px);aspect-ratio:1}
svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 5px var(--c))}
.s{fill:none;stroke:var(--c);transition:stroke .4s}
.in{transform-box:fill-box;transform-origin:center;animation:in 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:scale(.8)}}
.rot{transform-box:fill-box;transform-origin:center;animation:spin calc(var(--t) * var(--k)) linear infinite}
.ccw{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#core{animation:core 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
body[data-s=speak] #core{animation-duration:.7s}
body[data-s=think] #core{animation-duration:.9s}
@keyframes core{50%{transform:scale(.94);opacity:.8}}
#bars line{stroke:var(--c);stroke-width:2.4;stroke-linecap:round;transition:stroke .4s}
#mic{position:absolute;inset:34%;border-radius:50%;border:1px solid var(--c);background:rgba(0,19,28,.55);color:var(--c);display:grid;place-items:center;cursor:pointer;padding:0;transition:color .4s,border-color .4s,box-shadow .4s;box-shadow:0 0 18px -4px var(--c),inset 0 0 18px -6px var(--c)}
#mic svg{width:42%;height:42%;filter:none}
#mic:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
#tx{position:relative;width:min(92vw,560px);min-height:62px;max-height:20dvh;overflow:auto;border-left:2px solid var(--c);padding:6px 12px;margin:4px 0 10px;transition:border-color .4s}
#tx p{margin:0 0 4px;overflow-wrap:anywhere}
#you{color:var(--dim)}
footer{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(92vw,560px);padding-bottom:calc(14px + 6px)}
footer>*{font:400 11px/1.3 Orbitron,system-ui,sans-serif;letter-spacing:.12em;color:var(--dim);background:linear-gradient(90deg,rgba(56,232,255,.12),transparent);border:0;border-left:2px solid var(--c);padding:8px 10px;text-align:left;min-width:0;transition:border-color .4s}
<label>Tonalité<input id="pitch" type="range" min=".6" max="1.2" step=".02"></label>
<button id="test" type="button">Tester la voix</button>
<button id="wipe" type="button">Effacer la mémoire</button>
</div>
<main>
<div id="hud">
<svg viewBox="-300 -300 600 600" aria-hidden="true">
<defs><radialGradient id="cg"><stop offset="0" style="stop-color:var(--c)" stop-opacity=".6"/><stop offset="1" style="stop-color:var(--c)" stop-opacity="0"/></radialGradient></defs>
<g class="in" style="--d:.0s"><circle class="s" r="288" stroke-width="1" opacity=".5"/></g>
<g class="in" style="--d:.1s"><circle class="s rot" style="--t:90s" r="272" stroke-width="10" stroke-dasharray="2 12.24" opacity=".7"/></g>
<g class="in" style="--d:.2s"><circle class="s rot ccw" style="--t:60s" r="245" stroke-width="3" stroke-dasharray="260 40 60 24.8"/></g>
<g class="in" style="--d:.3s"><circle class="s rot" style="--t:40s" r="215" stroke-width="8" stroke-dasharray="300 30 90 30.3" opacity=".85"/></g>
<g class="in" style="--d:.4s"><circle class="s" r="186" stroke-width="1" opacity=".55"/><circle class="s rot ccw" style="--t:30s" r="178" stroke-width="1.5" stroke-dasharray="2 8" opacity=".8"/></g>
<g class="in" style="--d:.5s"><g id="bars"></g></g>
<g class="in" style="--d:.6s"><circle class="s rot ccw" style="--t:24s" r="118" stroke-width="12" stroke-dasharray="215 32.1"/></g>
<g class="in" style="--d:.7s"><circle id="core" r="98" fill="url(#cg)"/><circle class="s" r="98" stroke-width="1.5"/></g>
</svg>
<button id="mic" type="button" aria-label="Parler à Jarvis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
</div>
</main>
<section id="tx" aria-live="polite"><p id="you"></p><p id="jar">Touchez le micro une fois, puis dites « Jarvis ».</p></section>
<footer>
<div id="clock">HEURE<b>--:--</b></div>
<div id="memc">MÉMOIRE<b>0 souvenir</b></div>
</footer>
<script>
   let d=false;const go=()=>{if(d)return;d=true;setTimeout(next,i<q.length?130:0)};
   u.onend=go;u.onerror=go;setTimeout(go,Math.max(4000,u.text.length*160));
   TTS.speak(u)};
  next()});
}

/* ---- écoute continue, mot d'éveil « Jarvis » ---- */
const WAKE=/^(?:.{0,25}?)\b(?:j\W?a\W?r\W?v\W?i\W?s|jarvi[sc]e?|gervaise?|charvis|garvis|jarvik|djarvis)\b[\s,.!?:;-]*/i;
const norm=s=>s.toLowerCase().replace(/(\d),(\d)/g,'$1.$2').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'`-]/g,' ').replace(/[?!,;:]/g,' ').replace(/\.(\s|$)/g,' ').replace(/\s+/g,' ').trim();
function stopRec(){if(rec){rec.onend=rec.onerror=null;try{rec.abort()}catch(e){}rec=null}}
const fatal=t=>{voiceOff=true;session=false;stopRec();S('idle');show('#jar',t)};
function startRec(){
 if(!SR||rec||!session||voiceOff)return;
 const r=new SR();r.lang='fr-FR';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
 r.onstart=()=>{fails=0;if(!speaking&&!busy)S('listen')};
 r.onresult=e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){
   const res=e.results[i];
   if(res.isFinal){const alts=[];for(let k=0;k<res.length;k++)alts.push(res[k].transcript);heard(alts)}
   else if(!speaking&&!busy&&Date.now()>deafUntil)show('#you','… '+res[0].transcript)}
 };
 r.onerror=e=>{
  const er=e.error;
  if(er==='no-speech'||er==='aborted')return;
  if(er==='not-allowed'||er==='service-not-allowed')return fatal(window.top!==window?'Cette page est affichée dans une fenêtre intégrée qui bloque le micro, monsieur. Ouvrez-la comme application, ou directement à son adresse.':'Le micro est refusé pour ce site, monsieur. Touchez le cadenas à côté de l’adresse, autorisez le micro, puis rechargez la page.');
  if(er==='audio-capture')return fatal('Je ne détecte aucun micro, monsieur.');
}
function endSession(){
 session=false;epoch++;sid++;stopRec();try{if(TTS)TTS.cancel()}catch(e){}
 speaking=false;try{if(wl)wl.release()}catch(e){}S('idle');
}
$('#mic').onclick=()=>session?endSession():startSession();

/* ---- menu ⋯ : voix et mémoire ---- */
$('#gear').onclick=()=>{const m=$('#menu');m.hidden=!m.hidden;$('#gear').setAttribute('aria-expanded',String(!m.hidden));if(!m.hidden)fillMenu()};
$('#vsel').onchange=e=>{store.set('voice',e.target.value);store.set('pitch','');fillMenu()};
$('#rate').oninput=e=>store.set('rate',e.target.value);
$('#pitch').oninput=e=>store.set('pitch',e.target.value);
$('#test').onclick=()=>{const t=P(['Voici ma voix, '+who()+'. Qu’en pensez-vous ?','À votre service, '+who()+'. Est-ce ainsi que vous me vouliez ?']);show('#jar',t);speak(t).then(after)};
let wipe=0;
$('#wipe').onclick=e=>{
 if(!wipe){wipe=setTimeout(()=>{wipe=0;e.target.textContent='Effacer la mémoire'},4000);e.target.textContent='Confirmer l’effacement';return}
 clearTimeout(wipe);wipe=0;mem.name='';mem.facts=[];saveMem();e.target.textContent='Mémoire effacée';setTimeout(()=>{e.target.textContent='Effacer la mémoire'},2000);
};
saveMem();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
